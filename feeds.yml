# Edit this file to add/remove sources. Commit -> the workflow re-runs automatically.
# type: rss (any RSS/Atom incl. Substack, Medium, YouTube, GitHub releases) | link (shown as a link card, never fetched)
# topic: free text tag used for filter chips.  enabled: false to pause a source.
default_limit: 3   # newest posts taken per feed per run; override per feed with limit: 5
feeds:
  - {name: "I'd Rather Be Writing", type: rss, topic: "Technical writing", url: "https://idratherbewriting.com/feed.xml"}
  - {name: "Chris Chinchilla", type: rss, topic: "Technical writing", url: "https://chrischinchilla.com/rss.xml"}
  - {name: "Passo.uno (Fabrizio Ferri Benedetti)", type: rss, topic: "Technical writing", url: "https://passo.uno/posts/index.xml"}
  - {name: "Write the Docs", type: rss, topic: "Community", url: "https://www.writethedocs.org/blog/archive/atom.xml"}
  - {name: "Docusaurus releases", type: rss, topic: "Docs tooling", url: "https://github.com/facebook/docusaurus/releases.atom"}
  - {name: "MkDocs Material releases", type: rss, topic: "Docs tooling", url: "https://github.com/squidfunk/mkdocs-material/releases.atom"}
  - {name: "Sphinx releases", type: rss, topic: "Docs tooling", url: "https://github.com/sphinx-doc/sphinx/releases.atom"}
  - {name: "Vale releases", type: rss, topic: "Docs tooling", url: "https://github.com/errata-ai/vale/releases.atom"}
  - {name: "dev.to: documentation", type: rss, topic: "Docs-as-code", url: "https://dev.to/feed/tag/documentation"}
  - {name: "Medium: technical writing", type: rss, topic: "Technical writing", url: "https://medium.com/feed/tag/technical-writing"}
  - {name: "Hacker News: documentation", type: rss, topic: "Discussion", url: "https://hnrss.org/newest?q=documentation&points=50", enabled: false}
  # Examples to enable (replace the placeholders):
  - {name: "The Content Wrangler", type: rss, topic: "Newsletters", url: "https://www.thecontentwrangler.com/feed"}
  - {name: "Cyborgs Writing (Lance Cummings)", type: rss, topic: "AI and content", url: "https://www.isophist.com/feed"}
  - {name: "Example YouTube channel", type: rss, topic: "Video", url: "https://www.youtube.com/feeds/videos.xml?channel_id=CHANNEL_ID", enabled: false}
voices:   # link-only: no API, no scraping
  - {name: "Tom Johnson on X", platform: X, url: "https://x.com/tomjohnson", note: "Technical writing, AI and docs"}
  - {name: "Write the Docs on LinkedIn", platform: LinkedIn, url: "https://www.linkedin.com/company/write-the-docs/", note: "Community announcements"}
